
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>StreamVault</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/poppins@latest/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a2e;
      --bg-glass: rgba(255,255,255,0.05);
      --accent: #e50914;
      --accent-hover: #ff1a25;
      --accent-gold: #f5c518;
      --text-primary: #ffffff;
      --text-secondary: #a0a0b0;
      --text-muted: #6b6b80;
      --gradient-hero: linear-gradient(to top, #0a0a0f 0%, transparent 60%);
      --gradient-card: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
      --border-subtle: rgba(255,255,255,0.08);
      --shadow-card: 0 8px 32px rgba(0,0,0,0.6);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --nav-height: 64px;
      --header-height: 56px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    [data-theme="amoled"] {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0a;
      --bg-card: #111111;
      --bg-glass: rgba(255,255,255,0.03);
      --gradient-hero: linear-gradient(to top, #000000 0%, transparent 60%);
    }
    [data-theme="light"] {
      --bg-primary: #f5f5f7;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-glass: rgba(0,0,0,0.03);
      --text-primary: #1a1a2e;
      --text-secondary: #555566;
      --text-muted: #888899;
      --border-subtle: rgba(0,0,0,0.08);
      --shadow-card: 0 8px 32px rgba(0,0,0,0.1);
      --gradient-hero: linear-gradient(to top, #f5f5f7 0%, transparent 60%);
      --gradient-card: linear-gradient(to top, rgba(255,255,255,0.9) 0%, transparent 100%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    *::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
    html { font-size: 14px; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    @media (min-width: 768px) { html { font-size: 16px; } }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: calc(var(--nav-height) + var(--safe-bottom));
    }
    h1, h2, h3, h4, h5 { font-family: 'Poppins', sans-serif; font-weight: 700; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input { font-family: inherit; }
    #app { position: relative; min-height: 100vh; min-height: 100dvh; }

    #top-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--header-height); padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      transition: background 0.3s, backdrop-filter 0.3s;
      padding-top: var(--safe-top);
    }
    #top-header.scrolled {
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .header-logo { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 1.4rem; color: var(--accent); letter-spacing: -0.5px; }
    .header-actions { display: flex; gap: 12px; align-items: center; }
    .header-actions button {
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; font-size: 1.1rem; transition: background 0.2s;
    }
    .header-actions button:hover { background: var(--bg-glass); }

    #bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      height: calc(var(--nav-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-around;
      transition: transform 0.3s ease;
    }
    #bottom-nav.hidden { transform: translateY(100%); }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 8px 12px; min-width: 60px; border-radius: var(--radius-sm); transition: all 0.2s; position: relative;
    }
    .nav-item i { font-size: 1.2rem; color: var(--text-muted); transition: color 0.2s; }
    .nav-item span { font-size: 0.65rem; color: var(--text-muted); transition: color 0.2s; font-weight: 500; }
    .nav-item.active i { color: var(--accent); }
    .nav-item.active span { color: var(--accent); }
    .nav-item.active::before {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 24px; height: 2px; background: var(--accent); border-radius: 2px;
    }

    #main-content { padding-top: 0; min-height: 100vh; min-height: 100dvh; }

    .hero { position: relative; width: 100%; height: 100svh; overflow: hidden; }
    @media (min-width: 768px) { .hero { height: 70vh; } }
    .hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease; }
    .hero-slide.active { opacity: 1; }
    .hero-slide img { width: 100%; height: 100%; object-fit: cover; animation: kenBurns 20s ease infinite alternate; }
    @keyframes kenBurns { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }
    .hero-overlay { position: absolute; inset: 0; background: var(--gradient-hero); }
    .hero-content { position: absolute; bottom: 80px; left: 16px; right: 16px; z-index: 2; }
    @media (min-width: 768px) { .hero-content { bottom: 60px; left: 40px; right: 40px; max-width: 600px; } }
    .hero-title { font-size: clamp(1.5rem, 5vw, 2.5rem); font-weight: 800; margin-bottom: 8px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); line-height: 1.1; }
    .hero-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
    .hero-rating { display: flex; align-items: center; gap: 4px; color: var(--accent-gold); font-weight: 600; font-size: 0.9rem; }
    .hero-meta span { color: var(--text-secondary); font-size: 0.85rem; }
    .hero-genres { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .hero-genre-tag { padding: 3px 10px; border-radius: 20px; background: var(--bg-glass); border: 1px solid var(--border-subtle); font-size: 0.7rem; color: var(--text-secondary); }
    .hero-overview { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .hero-buttons { display: flex; gap: 12px; }
    .btn-play {
      display: flex; align-items: center; gap: 8px; padding: 12px 24px;
      background: var(--accent); color: white; border-radius: var(--radius-sm);
      font-weight: 600; font-size: 0.95rem; transition: background 0.2s, transform 0.2s;
    }
    .btn-play:hover { background: var(--accent-hover); transform: scale(1.02); }
    .btn-info {
      display: flex; align-items: center; gap: 8px; padding: 12px 20px;
      background: var(--bg-glass); backdrop-filter: blur(10px);
      border: 1px solid var(--border-subtle); color: white; border-radius: var(--radius-sm);
      font-weight: 500; font-size: 0.95rem; transition: background 0.2s;
    }
    .btn-info:hover { background: rgba(255,255,255,0.1); }
    .hero-dots { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 3; }
    .hero-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: all 0.3s; cursor: pointer; }
    .hero-dot.active { background: var(--accent); width: 24px; border-radius: 4px; }

    .quick-chips { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scroll-snap-type: x mandatory; }
    .chip {
      flex-shrink: 0; padding: 8px 16px; border-radius: 20px;
      background: var(--bg-glass); border: 1px solid var(--border-subtle);
      font-size: 0.8rem; font-weight: 500; color: var(--text-secondary);
      scroll-snap-align: start; transition: all 0.2s; white-space: nowrap;
    }
    .chip.active, .chip:hover { background: var(--accent); color: white; border-color: var(--accent); }

    .carousel-section { padding: 16px 0; }
    .carousel-header { display: flex; justify-content: space-between; align-items: center; padding: 0 16px; margin-bottom: 12px; }
    .carousel-title { font-size: 1.1rem; font-weight: 700; }
    .carousel-see-all { font-size: 0.8rem; color: var(--accent); font-weight: 500; }
    .carousel-track { display: flex; gap: 10px; padding: 0 16px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
    .carousel-card {
      flex-shrink: 0; width: 130px; scroll-snap-align: start; cursor: pointer; transition: transform 0.2s;
    }
    @media (min-width: 480px) { .carousel-card { width: 150px; } }
    @media (min-width: 768px) { .carousel-card { width: 180px; } }
    @media (min-width: 1200px) { .carousel-card { width: 200px; } }
    .carousel-card:active { transform: scale(0.95); }
    .carousel-poster { position: relative; aspect-ratio: 2/3; border-radius: var(--radius-md); overflow: hidden; margin-bottom: 8px; }
    .carousel-poster img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .carousel-card:hover .carousel-poster img { transform: scale(1.05); }
    .carousel-poster-overlay {
      position: absolute; inset: 0; background: var(--gradient-card);
      opacity: 0; transition: opacity 0.3s; display: flex; align-items: center; justify-content: center;
    }
    .carousel-card:hover .carousel-poster-overlay { opacity: 1; }
    .carousel-poster-overlay i { font-size: 2rem; color: white; }
    .carousel-card-title { font-size: 0.8rem; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
    .carousel-card-rating { display: flex; align-items: center; gap: 4px; font-size: 0.75rem; color: var(--accent-gold); }
    .carousel-bookmark {
      position: absolute; top: 8px; right: 8px; width: 28px; height: 28px;
      border-radius: 50%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; z-index: 2; opacity: 0; transition: opacity 0.2s;
    }
    .carousel-card:hover .carousel-bookmark { opacity: 1; }
    .carousel-bookmark.saved { opacity: 1; color: var(--accent); }

    .browse-header {
      position: sticky; top: var(--header-height); z-index: 50;
      background: rgba(10,10,15,0.9); backdrop-filter: blur(20px);
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
    }
    .browse-title { font-size: 1.2rem; font-weight: 700; }
    .browse-actions { display: flex; gap: 8px; }
    .browse-actions button { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-glass); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
    .content-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; }
    @media (min-width: 480px) { .content-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 768px) { .content-grid { grid-template-columns: repeat(5, 1fr); } }
    @media (min-width: 1200px) { .content-grid { grid-template-columns: repeat(6, 1fr); gap: 16px; } }
    .grid-card { cursor: pointer; transition: transform 0.2s; }
    .grid-card:active { transform: scale(0.95); }
    .grid-poster { position: relative; aspect-ratio: 2/3; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 6px; }
    .grid-poster img { width: 100%; height: 100%; object-fit: cover; }
    .grid-card-title { font-size: 0.75rem; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
    .grid-card-meta { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; }
    .grid-bookmark { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; font-size: 0.6rem; }
    .grid-bookmark.saved { color: var(--accent); }

    .detail-page { padding-bottom: 40px; }
    .detail-backdrop { position: relative; width: 100%; height: 50vh; overflow: hidden; }
    @media (min-width: 768px) { .detail-backdrop { height: 60vh; } }
    .detail-backdrop img { width: 100%; height: 100%; object-fit: cover; }
    .detail-backdrop-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg-primary) 0%, transparent 50%, rgba(0,0,0,0.3) 100%); }
    .detail-backdrop-actions { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 5; padding-top: var(--safe-top); }
    .detail-back-btn, .detail-action-btn {
      width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;
      font-size: 1rem; transition: background 0.2s;
    }
    .detail-back-btn:hover, .detail-action-btn:hover { background: rgba(0,0,0,0.7); }
    .detail-right-actions { display: flex; gap: 8px; }
    .detail-body { position: relative; padding: 0 16px; margin-top: -80px; z-index: 3; }
    .detail-poster { width: 120px; aspect-ratio: 2/3; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); margin-bottom: 16px; border: 2px solid var(--border-subtle); }
    .detail-poster img { width: 100%; height: 100%; object-fit: cover; }
    .detail-title { font-size: clamp(1.3rem, 4vw, 2rem); font-weight: 800; margin-bottom: 4px; line-height: 1.2; }
    .detail-original-title { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
    .detail-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .detail-meta-item { display: flex; align-items: center; gap: 4px; font-size: 0.85rem; color: var(--text-secondary); }
    .detail-meta-item.rating { color: var(--accent-gold); font-weight: 600; }
    .detail-genres { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .detail-genre { padding: 4px 12px; border-radius: 20px; background: var(--bg-glass); border: 1px solid var(--border-subtle); font-size: 0.75rem; color: var(--text-secondary); }
    .detail-tagline { font-style: italic; color: var(--accent); font-size: 0.9rem; margin-bottom: 16px; }
    .detail-actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .detail-actions .btn-play { flex: 1; justify-content: center; min-width: 140px; }
    .detail-action-secondary {
      display: flex; align-items: center; gap: 6px; padding: 10px 16px;
      background: var(--bg-glass); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 500; transition: background 0.2s;
    }
    .detail-action-secondary:hover { background: rgba(255,255,255,0.1); }
    .detail-action-secondary.saved { color: var(--accent); border-color: var(--accent); }
    .detail-section { margin-bottom: 24px; }
    .detail-section-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
    .detail-overview { font-size: 0.9rem; line-height: 1.7; color: var(--text-secondary); }
    .detail-overview.expanded { -webkit-line-clamp: unset; }
    .detail-overview:not(.expanded) { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .read-more-btn { color: var(--accent); font-size: 0.85rem; font-weight: 500; margin-top: 4px; }
    .cast-carousel { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
    .cast-item { flex-shrink: 0; text-align: center; width: 70px; }
    .cast-photo { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; margin: 0 auto 6px; border: 2px solid var(--border-subtle); }
    .cast-photo img { width: 100%; height: 100%; object-fit: cover; }
    .cast-name { font-size: 0.7rem; font-weight: 500; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cast-character { font-size: 0.6rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

    .season-selector { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
    .season-tab { flex-shrink: 0; padding: 8px 16px; border-radius: var(--radius-sm); background: var(--bg-glass); border: 1px solid var(--border-subtle); font-size: 0.8rem; font-weight: 500; transition: all 0.2s; }
    .season-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
    .episode-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-subtle); cursor: pointer; transition: background 0.2s; }
    .episode-item:hover { background: var(--bg-glass); }
    .episode-thumb { flex-shrink: 0; width: 120px; aspect-ratio: 16/9; border-radius: var(--radius-sm); overflow: hidden; }
    .episode-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .episode-info { flex: 1; }
    .episode-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .episode-meta { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .episode-overview { font-size: 0.75rem; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .player-page { background: #000; min-height: 100vh; }
    .player-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
    .player-container iframe { width: 100%; height: 100%; border: none; }
    .player-source-tabs { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; }
    .source-tab { flex-shrink: 0; padding: 8px 16px; border-radius: var(--radius-sm); background: var(--bg-glass); border: 1px solid var(--border-subtle); font-size: 0.8rem; font-weight: 500; transition: all 0.2s; }
    .source-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
    .player-info { padding: 16px; }
    .player-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
    .player-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
    .episode-chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 16px; }
    .episode-chip { flex-shrink: 0; padding: 8px 14px; border-radius: var(--radius-sm); background: var(--bg-glass); border: 1px solid var(--border-subtle); font-size: 0.75rem; transition: all 0.2s; }
    .episode-chip.active { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-mark-watched {
      display: flex; align-items: center; gap: 8px; padding: 12px 20px; margin: 0 16px 16px;
      background: var(--bg-glass); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
      font-size: 0.85rem; font-weight: 500; width: calc(100% - 32px); justify-content: center; transition: all 0.2s;
    }
    .btn-mark-watched:hover { background: rgba(255,255,255,0.1); }

    .search-page { padding-top: var(--header-height); }
    .search-input-wrap { position: sticky; top: var(--header-height); z-index: 50; padding: 12px 16px; background: var(--bg-primary); }
    .search-input-container { display: flex; align-items: center; gap: 10px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 10px 16px; }
    .search-input-container i { color: var(--text-muted); }
    .search-input { flex: 1; background: none; border: none; outline: none; color: var(--text-primary); font-size: 0.95rem; }
    .search-input::placeholder { color: var(--text-muted); }
    .search-clear { color: var(--text-muted); font-size: 0.9rem; padding: 4px; }
    .recent-searches { padding: 0 16px 16px; }
    .recent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .recent-header span { font-size: 0.85rem; font-weight: 600; }
    .recent-clear { font-size: 0.75rem; color: var(--accent); }
    .recent-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .search-trending { padding: 0 16px; }
    .search-trending h3 { font-size: 1rem; margin-bottom: 12px; }
    .trending-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle); cursor: pointer; }
    .trending-rank { font-size: 1rem; font-weight: 700; color: var(--text-muted); width: 24px; }
    .trending-thumb { width: 50px; height: 70px; border-radius: var(--radius-sm); overflow: hidden; flex-shrink: 0; }
    .trending-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .trending-info { flex: 1; }
    .trending-title { font-size: 0.85rem; font-weight: 500; }
    .trending-meta { font-size: 0.75rem; color: var(--text-muted); }

    .watchlist-page, .history-page { padding-top: var(--header-height); }
    .page-header { padding: 16px; display: flex; align-items: center; justify-content: space-between; }
    .page-title { font-size: 1.3rem; font-weight: 700; }
    .tabs-row { display: flex; gap: 0; padding: 0 16px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px; text-align: center; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; text-align: center; }
    .empty-state i { font-size: 3rem; color: var(--text-muted); margin-bottom: 16px; }
    .empty-state h3 { font-size: 1.1rem; margin-bottom: 8px; }
    .empty-state p { font-size: 0.85rem; color: var(--text-muted); }

    .history-item { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); cursor: pointer; }
    .history-thumb { flex-shrink: 0; width: 80px; aspect-ratio: 2/3; border-radius: var(--radius-sm); overflow: hidden; }
    .history-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .history-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .history-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
    .history-meta { font-size: 0.75rem; color: var(--text-muted); }
    .history-delete { align-self: center; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--text-muted); transition: color 0.2s; }
    .history-delete:hover { color: var(--accent); }

    .settings-page { padding-top: var(--header-height); padding-bottom: 40px; }
    .settings-group { padding: 0 16px; margin-bottom: 24px; }
    .settings-group-title { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .settings-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; gap: 8px; }
    .settings-item-left { display: flex; align-items: center; gap: 12px; }
    .settings-item-left i { width: 20px; text-align: center; color: var(--text-muted); }
    .settings-item-label { font-size: 0.9rem; }
    .settings-item-value { font-size: 0.85rem; color: var(--text-muted); }
    .accent-colors { display: flex; gap: 10px; padding: 8px 0; }
    .accent-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: border-color 0.2s, transform 0.2s; }
    .accent-dot.active { border-color: white; transform: scale(1.15); }
    .settings-btn { display: block; width: 100%; padding: 14px; text-align: center; background: var(--bg-glass); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; transition: background 0.2s; }
    .settings-btn:hover { background: rgba(255,255,255,0.08); }
    .settings-btn.danger { color: #ff4444; }
    .settings-about { padding: 16px; text-align: center; font-size: 0.75rem; color: var(--text-muted); line-height: 1.6; }

    .skeleton { background: var(--bg-card); border-radius: var(--radius-sm); position: relative; overflow: hidden; }
    .skeleton::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .skeleton-poster { aspect-ratio: 2/3; border-radius: var(--radius-md); }
    .skeleton-text { height: 12px; margin-top: 8px; border-radius: 4px; }
    .skeleton-text.short { width: 60%; }

    #toast-container {
      position: fixed; bottom: calc(var(--nav-height) + var(--safe-bottom) + 16px);
      left: 50%; transform: translateX(-50%); z-index: 1000;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .toast {
      padding: 12px 20px; border-radius: var(--radius-sm); background: var(--bg-card);
      border: 1px solid var(--border-subtle); box-shadow: var(--shadow-card);
      font-size: 0.85rem; font-weight: 500;
      animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards; white-space: nowrap;
    }
    .toast.success { border-left: 3px solid #4caf50; }
    .toast.error { border-left: 3px solid #f44336; }
    .toast.info { border-left: 3px solid #2196f3; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }

    #modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      display: none; align-items: flex-end; justify-content: center;
    }
    @media (min-width: 768px) { #modal-overlay { align-items: center; } }
    #modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--bg-secondary); border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; padding: 24px;
      animation: slideUp 0.3s ease;
    }
    @media (min-width: 768px) { .modal-content { border-radius: var(--radius-xl); } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle { width: 40px; height: 4px; background: var(--text-muted); border-radius: 2px; margin: 0 auto 16px; }

    .filter-section { margin-bottom: 20px; }
    .filter-label { font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }
    .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-chip { padding: 6px 14px; border-radius: 20px; background: var(--bg-glass); border: 1px solid var(--border-subtle); font-size: 0.8rem; transition: all 0.2s; }
    .filter-chip.active { background: var(--accent); color: white; border-color: var(--accent); }
    .filter-actions { display: flex; gap: 12px; margin-top: 20px; }
    .filter-actions button { flex: 1; padding: 12px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
    .filter-apply { background: var(--accent); color: white; }
    .filter-reset { background: var(--bg-glass); border: 1px solid var(--border-subtle); }

    .page-enter { animation: fadeSlide 0.3s ease-out; }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .spinner { display: flex; align-items: center; justify-content: center; padding: 40px; }
    .spinner::after {
      content: ''; width: 32px; height: 32px;
      border: 3px solid var(--border-subtle); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .load-more { display: flex; justify-content: center; padding: 20px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <header id="top-header">
      <div class="header-logo">StreamVault</div>
      <div class="header-actions">
        <button onclick="navigate('#/search')" aria-label="Search"><i class="fas fa-search"></i></button>
        <button onclick="navigate('#/settings')" aria-label="Settings"><i class="fas fa-cog"></i></button>
      </div>
    </header>
    <main id="main-content"></main>
    <nav id="bottom-nav"></nav>
    <div id="toast-container"></div>
    <div id="modal-overlay" onclick="closeModal(event)"></div>
  </div>

  <script>
    const CONFIG = {
      API_KEY: '19809aee1bf6cf1580a3b80e83e3dc1d',
      BEARER: 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIxOTgwOWFlZTFiZjZjZjE1ODBhM2I4MGU4M2UzZGMxZCIsIm5iZiI6MTc5MDY4Njc1MC42MDMwMDAyLCJzdWIiOiI2YWJiYjYxZWFiMTYwMTY1ODI0M2UzMDkiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.0-5_HaWGOwVoj0c9v11_6o0AOLANbcGVl5sHw470-kM',
      BASE: 'https://api.themoviedb.org/3',
      IMG: 'https://image.tmdb.org/t/p/',
      CACHE_TTL: 5 * 60 * 1000,
      DEBOUNCE: 400,
      GENRES: {
        28:'Action',12:'Adventure',16:'Animation',35:'Comedy',80:'Crime',99:'Documentary',
        18:'Drama',10751:'Family',14:'Fantasy',36:'History',27:'Horror',10402:'Music',
        9648:'Mystery',10749:'Romance',878:'Sci-Fi',10770:'TV Movie',53:'Thriller',
        10752:'War',37:'Western',10759:'Action & Adventure',10762:'Kids',10763:'News',
        10764:'Reality',10765:'Sci-Fi & Fantasy',10766:'Soap',10767:'Talk',10768:'War & Politics',10769:'Western'
      }
    };

    const cache = new Map();
    function getCached(key) {
      const item = cache.get(key);
      if (item && Date.now() - item.time < CONFIG.CACHE_TTL) return item.data;
      cache.delete(key);
      return null;
    }
    function setCache(key, data) { cache.set(key, { data, time: Date.now() }); }

    async function api(endpoint, params = {}) {
      const url = new URL(CONFIG.BASE + endpoint);
      Object.entries(params).forEach(([k, v]) => { if (v !== undefined && v !== null) url.searchParams.set(k, v); });
      const cacheKey = url.toString();
      const cached = getCached(cacheKey);
      if (cached) return cached;
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const res = await fetch(url.toString(), {
            headers: { 'Authorization': 'Bearer ' + CONFIG.BEARER, 'Accept': 'application/json' }
          });
          if (res.status === 429) { await new Promise(r => setTimeout(r, 1000 * (attempt + 1))); continue; }
          if (!res.ok) throw new Error('API Error: ' + res.status);
          const data = await res.json();
          setCache(cacheKey, data);
          return data;
        } catch (e) {
          if (attempt === 2) { console.error('API Error:', e); showToast('Network error. Please try again.', 'error'); return null; }
          await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
        }
      }
      return null;
    }

    function imgUrl(path, size) {
      size = size || 'w342';
      if (!path) return 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300"><rect fill="%231a1a2e" width="200" height="300"/><text x="100" y="150" text-anchor="middle" fill="%236b6b80" font-size="14">No Image</text></svg>';
      return CONFIG.IMG + size + path;
    }

    const storage = {
      get: function(key, def) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : (def || null); } catch(e) { return def || null; } },
      set: function(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} },
      remove: function(key) { localStorage.removeItem(key); }
    };

    var state = {
      currentRoute: '#/home',
      watchlist: storage.get('watchlist', []),
      history: storage.get('history', []),
      theme: storage.get('theme', 'dark'),
      accent: storage.get('accent', '#e50914'),
      searchQuery: '',
      recentSearches: storage.get('recentSearches', []),
      heroIndex: 0,
      heroItems: [],
      browseFilters: { genre: null, sort: 'popularity.desc', year: null, rating: null },
      tvSeason: 1
    };

    function showToast(msg, type) {
      type = type || 'info';
      var container = document.getElementById('toast-container');
      var toast = document.createElement('div');
      toast.className = 'toast ' + type;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(function() { if (toast.parentNode) toast.remove(); }, 3000);
    }

    function openModal(html) {
      var overlay = document.getElementById('modal-overlay');
      overlay.innerHTML = '<div class="modal-content"><div class="modal-handle"></div>' + html + '</div>';
      overlay.classList.add('active');
    }
    function closeModal(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('modal-overlay').classList.remove('active');
    }

    function isInWatchlist(id) { return state.watchlist.some(function(i) { return i.id === id; }); }
    function toggleWatchlist(item) {
      if (isInWatchlist(item.id)) {
        state.watchlist = state.watchlist.filter(function(i) { return i.id !== item.id; });
        showToast('Removed from Watchlist', 'info');
      } else {
        state.watchlist.unshift(item);
        showToast('Added to Watchlist', 'success');
      }
      storage.set('watchlist', state.watchlist);
      refreshBookmarkButtons(item.id);
    }

    function refreshBookmarkButtons(id) {
      var saved = isInWatchlist(id);
      document.querySelectorAll('[data-bookmark-id="' + id + '"]').forEach(function(btn) {
        if (saved) btn.classList.add('saved'); else btn.classList.remove('saved');
      });
    }

    function addToHistory(item) {
      state.history = state.history.filter(function(i) { return i.id !== item.id; });
      item.watchedAt = Date.now();
      state.history.unshift(item);
      if (state.history.length > 100) state.history = state.history.slice(0, 100);
      storage.set('history', state.history);
    }
    function clearHistory() {
      state.history = [];
      storage.set('history', []);
      showToast('History cleared', 'info');
      renderHistory();
    }

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', state.theme);
      document.documentElement.style.setProperty('--accent', state.accent);
    }

    function navigate(hash) { window.location.hash = hash; }

    function parseRoute() {
      var hash = window.location.hash || '#/home';
      var parts = hash.replace('#/', '').split('/');
      return { page: parts[0] || 'home', id: parts[1], extra: parts[2], extra2: parts[3] };
    }

    function handleRoute() {
      var route = parseRoute();
      state.currentRoute = '#/' + route.page + (route.id ? '/' + route.id : '');
      window.scrollTo(0, 0);
      updateNav();
      updateHeader();

      var main = document.getElementById('main-content');
      main.innerHTML = '<div class="spinner"></div>';
      setTimeout(function() { main.className = 'page-enter'; }, 10);

      switch (route.page) {
        case 'home': renderHome(); break;
        case 'movies': renderBrowse('movie'); break;
        case 'tv': if (route.id) renderDetail('tv', route.id); else renderBrowse('tv'); break;
        case 'anime': renderBrowse('anime'); break;
        case 'search': renderSearch(); break;
        case 'movie': renderDetail('movie', route.id); break;
        case 'player': renderPlayer(route.id, route.extra, route.extra2); break;
        case 'watchlist': renderWatchlist(); break;
        case 'history': renderHistory(); break;
        case 'settings': renderSettings(); break;
        case 'mystuff': renderMyStuff(); break;
        default: renderHome();
      }
    }

    window.addEventListener('hashchange', handleRoute);

    function updateNav() {
      var route = parseRoute();
      var navItems = [
        { icon: 'fa-home', label: 'Home', route: '#/home', match: ['home'] },
        { icon: 'fa-search', label: 'Search', route: '#/search', match: ['search'] },
        { icon: 'fa-film', label: 'Movies', route: '#/movies', match: ['movies'] },
        { icon: 'fa-tv', label: 'TV Shows', route: '#/tv', match: ['tv'] },
        { icon: 'fa-user', label: 'My Stuff', route: '#/mystuff', match: ['mystuff', 'watchlist', 'history', 'settings'] }
      ];
      var nav = document.getElementById('bottom-nav');
      nav.innerHTML = navItems.map(function(item) {
        var active = item.match.indexOf(route.page) !== -1 ? 'active' : '';
        return '<button class="nav-item ' + active + '" onclick="navigate(\'' + item.route + '\')"><i class="fas ' + item.icon + '"></i><span>' + item.label + '</span></button>';
      }).join('');
    }

    function updateHeader() {
      var header = document.getElementById('top-header');
      var route = parseRoute();
      if (route.page === 'home') header.classList.remove('scrolled');
      else header.classList.add('scrolled');
    }

    var lastScroll = 0;
    var navHidden = false;
    window.addEventListener('scroll', function() {
      var scrollY = window.scrollY;
      var header = document.getElementById('top-header');
      var nav = document.getElementById('bottom-nav');
      var route = parseRoute();
      if (route.page === 'home') {
        if (scrollY > 100) header.classList.add('scrolled');
        else header.classList.remove('scrolled');
      }
      if (scrollY > lastScroll && scrollY > 200 && !navHidden) { nav.classList.add('hidden'); navHidden = true; }
      else if (scrollY < lastScroll && navHidden) { nav.classList.remove('hidden'); navHidden = false; }
      lastScroll = scrollY;
    }, { passive: true });

    function skeletonCardsHTML(count) {
      var html = '';
      for (var i = 0; i < count; i++) {
        html += '<div class="carousel-card"><div class="skeleton skeleton-poster"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>';
      }
      return html;
    }

    function skeletonGridHTML(count) {
      var html = '';
      for (var i = 0; i < count; i++) {
        html += '<div class="grid-card"><div class="skeleton skeleton-poster"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>';
      }
      return html;
    }

    function carouselCardHTML(item, type) {
      var mediaType = type || item.media_type || (item.title ? 'movie' : 'tv');
      var title = item.title || item.name || '';
      var rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
      var saved = isInWatchlist(item.id) ? 'saved' : '';
      var itemData = JSON.stringify({id:item.id,title:item.title||item.name,poster_path:item.poster_path,media_type:mediaType,vote_average:item.vote_average,release_date:item.release_date||item.first_air_date}).replace(/"/g, '&quot;');
      return '<div class="carousel-card" onclick="navigate(\'#/' + mediaType + '/' + item.id + '\')">' +
        '<div class="carousel-poster">' +
        '<img src="' + imgUrl(item.poster_path, 'w342') + '" alt="' + title + '" loading="lazy">' +
        '<div class="carousel-poster-overlay"><i class="fas fa-play"></i></div>' +
        '<button class="carousel-bookmark ' + saved + '" data-bookmark-id="' + item.id + '" onclick="event.stopPropagation();toggleWatchlist(' + itemData + ')" aria-label="Toggle watchlist"><i class="fas fa-bookmark"></i></button>' +
        '</div>' +
        '<div class="carousel-card-title">' + title + '</div>' +
        '<div class="carousel-card-rating"><i class="fas fa-star"></i> ' + rating + '</div></div>';
    }

    function gridCardHTML(item, type) {
      var mediaType = type || item.media_type || (item.title ? 'movie' : 'tv');
      var title = item.title || item.name || '';
      var year = (item.release_date || item.first_air_date || '').slice(0, 4);
      var rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
      var saved = isInWatchlist(item.id) ? 'saved' : '';
      var itemData = JSON.stringify({id:item.id,title:item.title||item.name,poster_path:item.poster_path,media_type:mediaType,vote_average:item.vote_average,release_date:item.release_date||item.first_air_date}).replace(/"/g, '&quot;');
      return '<div class="grid-card" onclick="navigate(\'#/' + mediaType + '/' + item.id + '\')">' +
        '<div class="grid-poster">' +
        '<img src="' + imgUrl(item.poster_path, 'w342') + '" alt="' + title + '" loading="lazy">' +
        '<button class="grid-bookmark ' + saved + '" data-bookmark-id="' + item.id + '" onclick="event.stopPropagation();toggleWatchlist(' + itemData + ')" aria-label="Toggle watchlist"><i class="fas fa-bookmark"></i></button>' +
        '</div>' +
        '<div class="grid-card-title">' + title + '</div>' +
        '<div class="grid-card-meta">' + year + ' &middot; <i class="fas fa-star" style="color:var(--accent-gold)"></i> ' + rating + '</div></div>';
    }

    var heroInterval = null;

    async function renderHome() {
      var main = document.getElementById('main-content');
      var skeletonRows = '';
      for (var r = 0; r < 6; r++) {
        skeletonRows += '<div class="carousel-section"><div class="carousel-header"><div class="skeleton" style="width:150px;height:20px;border-radius:4px"></div></div><div class="carousel-track">' + skeletonCardsHTML(7) + '</div></div>';
      }
      main.innerHTML =
        '<div class="hero" id="hero-banner">' +
          '<div id="hero-slides"><div class="hero-slide active"><div class="skeleton" style="width:100%;height:100%"></div></div></div>' +
          '<div class="hero-overlay"></div>' +
          '<div class="hero-content" id="hero-content"></div>' +
          '<div class="hero-dots" id="hero-dots"></div>' +
        '</div>' +
        '<div class="quick-chips" id="quick-chips"></div>' +
        '<div id="carousel-rows">' + skeletonRows + '</div>';

      var trending = await api('/trending/all/week');
      if (trending && trending.results) {
        state.heroItems = trending.results.slice(0, 5);
        renderHero();
      }

      var chips = ['All', 'Movies', 'TV Shows', 'Anime', 'Action', 'Comedy', 'Horror', 'Sci-Fi', 'Romance', 'Documentary'];
      var chipRoutes = {'All':'#/home','Movies':'#/movies','TV Shows':'#/tv','Anime':'#/anime','Action':'#/movies','Comedy':'#/movies','Horror':'#/movies','Sci-Fi':'#/movies','Romance':'#/movies','Documentary':'#/movies'};
      var chipsHTML = '';
      for (var i = 0; i < chips.length; i++) {
        chipsHTML += '<button class="chip ' + (i === 0 ? 'active' : '') + '" onclick="navigate(\'' + chipRoutes[chips[i]] + '\')">' + chips[i] + '</button>';
      }
      document.getElementById('quick-chips').innerHTML = chipsHTML;

      var rows = [
        { title: '🔥 Trending Now', endpoint: '/trending/all/week', type: 'movie' },
        { title: '🎬 Popular Movies', endpoint: '/movie/popular', type: 'movie' },
        { title: '📺 Trending TV Shows', endpoint: '/trending/tv/week', type: 'tv' },
        { title: '🎌 Top Anime', endpoint: '/discover/movie', params: { with_genres: '16', with_keywords: '210024' }, type: 'movie' },
        { title: '🏆 Top Rated Movies', endpoint: '/movie/top_rated', type: 'movie' },
        { title: ' Now Playing', endpoint: '/movie/now_playing', type: 'movie' },
        { title: '📡 On The Air (TV)', endpoint: '/tv/on_the_air', type: 'tv' },
        { title: '🎭 Popular Anime Series', endpoint: '/discover/tv', params: { with_genres: '16', with_keywords: '210024' }, type: 'tv' },
        { title: '📈 Upcoming Movies', endpoint: '/movie/upcoming', type: 'movie' },
        { title: '⭐ Top Rated TV', endpoint: '/tv/top_rated', type: 'tv' }
      ];

      var container = document.getElementById('carousel-rows');
      container.innerHTML = '';

      for (var ri = 0; ri < rows.length; ri++) {
        var row = rows[ri];
        var data = await api(row.endpoint, row.params || {});
        if (!data || !data.results) continue;
        var section = document.createElement('div');
        section.className = 'carousel-section';
        var cardsHTML = '';
        for (var ci = 0; ci < Math.min(data.results.length, 15); ci++) {
          cardsHTML += carouselCardHTML(data.results[ci], row.type);
        }

    var browsePage = 1;
    var browseLoading = false;
    var browseType = 'movie';
    var browseTotalPages = 1;

    async function renderBrowse(type) {
      browseType = type;
      browsePage = 1;
      browseLoading = false;
      var main = document.getElementById('main-content');
      var titles = { movie: 'Movies', tv: 'TV Shows', anime: 'Anime' };

      main.innerHTML =
        '<div class="browse-header">' +
          '<h1 class="browse-title">' + (titles[type] || 'Browse') + '</h1>' +
          '<div class="browse-actions"><button onclick="openFilterSheet()"><i class="fas fa-filter"></i></button></div>' +
        '</div>' +
        '<div class="content-grid" id="browse-grid">' + skeletonGridHTML(12) + '</div>' +
        '<div class="load-more" id="load-more"><div class="spinner"></div></div>';

      await loadBrowsePage();

      var observer = new IntersectionObserver(function(entries) {
        if (entries[0].isIntersecting && !browseLoading && browsePage < browseTotalPages) {
          loadBrowsePage();
        }
      }, { threshold: 0.1 });
      var loadMore = document.getElementById('load-more');
      if (loadMore) observer.observe(loadMore);
    }

    async function loadBrowsePage() {
      if (browseLoading) return;
      browseLoading = true;

      var endpoint, params = { page: browsePage };
      if (browseType === 'anime') {
        endpoint = '/discover/movie';
        params.with_genres = '16';
        params.with_keywords = '210024';
      } else if (browseType === 'movie') {
        endpoint = '/movie/popular';
      } else {
        endpoint = '/tv/popular';
      }

      if (state.browseFilters.genre) {
        params.with_genres = state.browseFilters.genre;
        if (browseType === 'anime') endpoint = '/discover/movie';
        else if (browseType === 'tv') endpoint = '/discover/tv';
        else endpoint = '/discover/movie';
      }
      if (state.browseFilters.sort) params.sort_by = state.browseFilters.sort;

      var data = await api(endpoint, params);
      browseLoading = false;
      if (!data || !data.results) return;
      browseTotalPages = data.total_pages || 1;

      var grid = document.getElementById('browse-grid');
      if (!grid) return;
      if (browsePage === 1) grid.innerHTML = '';

      var gridType = browseType === 'anime' ? 'movie' : browseType;
      for (var i = 0; i < data.results.length; i++) {
        grid.insertAdjacentHTML('beforeend', gridCardHTML(data.results[i], gridType));
      }

      if (browsePage >= browseTotalPages) {
        var lm = document.getElementById('load-more');
        if (lm) lm.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem;padding:20px">No more results</p>';
      }
      browsePage++;
    }

        navigator.clipboard.writeText(window.location.href);

          '<div id="search-default">' +
            recentHTML +
            '<div class="search-trending" id="search-trending"><h3>Trending Now</h3><div class="spinner"></div></div>' +
          '</div>' +
        '</div>';

      var input = document.getElementById('search-input');
      input.addEventListener('input', function(e) {
        var val = e.target.value.trim();
        document.getElementById('search-clear').style.display = val ? 'block' : 'none';
        document.getElementById('search-default').style.display = val ? 'none' : 'block';

        if (searchTimeout) clearTimeout(searchTimeout);
        if (val.length < 2) {
          document.getElementById('search-results').innerHTML = '';
          return;
        }
        searchTimeout = setTimeout(function() { performSearch(val); }, CONFIG.DEBOUNCE);
      });

      var trending = await api('/trending/all/day');
      var trendingEl = document.getElementById('search-trending');
      if (trending && trending.results && trendingEl) {
        var tHTML = '<h3>Trending Now</h3>';
        for (var ti = 0; ti < Math.min(trending.results.length, 10); ti++) {
          var item = trending.results[ti];
          var t = item.title || item.name;
          var mt = item.media_type || 'movie';
          var yr = (item.release_date || item.first_air_date || '').slice(0, 4);
          tHTML += '<div class="trending-item" onclick="navigate(\'#/' + mt + '/' + item.id + '\')">' +
            '<span class="trending-rank">' + (ti + 1) + '</span>' +
            '<div class="trending-thumb"><img src="' + imgUrl(item.poster_path, 'w92') + '" alt="" loading="lazy"></div>' +
            '<div class="trending-info"><div class="trending-title">' + t + '</div><div class="trending-meta">' + yr + ' &middot; ' + (mt === 'movie' ? 'Movie' : 'TV') + '</div></div></div>';
        }
        trendingEl.innerHTML = tHTML;
      }

      setTimeout(function() { input.focus(); }, 100);
    }

    async function performSearch(query) {
      var data = await api('/search/multi', { query: query, include_adult: false });
      var resultsEl = document.getElementById('search-results');
      if (!resultsEl) return;

      if (!data || !data.results || !data.results.length) {
        resultsEl.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><h3>No results found</h3><p>Try a different search term</p></div>';
        return;
      }

      var filtered = data.results.filter(function(i) { return i.media_type === 'movie' || i.media_type === 'tv'; });
      var gridHTML = '<div class="content-grid">';
      for (var i = 0; i < filtered.length; i++) {
        gridHTML += gridCardHTML(filtered[i]);
      }
      gridHTML += '</div>';
      resultsEl.innerHTML = gridHTML;

      if (state.recentSearches.indexOf(query) === -1) {
        state.recentSearches.unshift(query);
        state.recentSearches = state.recentSearches.slice(0, 10);
        storage.set('recentSearches', state.recentSearches);
      }
    }

    function searchFor(query) {
      var input = document.getElementById('search-input');
      if (input) { input.value = query; input.dispatchEvent(new Event('input')); }
    }

    function clearSearch() {
      var input = document.getElementById('search-input');
      if (input) { input.value = ''; input.dispatchEvent(new Event('input')); input.focus(); }
      document.getElementById('search-clear').style.display = 'none';
      document.getElementById('search-default').style.display = 'block';
      document.getElementById('search-results').innerHTML = '';
    }

    function clearRecentSearches() {
      state.recentSearches = [];
      storage.set('recentSearches', []);
      renderSearch();
    }

    var watchlistTab = 'all';
    function renderWatchlist() {
      var main = document.getElementById('main-content');
      var movies = state.watchlist.filter(function(i) { return i.media_type === 'movie'; });
      var tvs = state.watchlist.filter(function(i) { return i.media_type === 'tv'; });

      var filtered = state.watchlist;
      if (watchlistTab === 'movie') filtered = movies;
      else if (watchlistTab === 'tv') filtered = tvs;

      var contentHTML = '';
      if (filtered.length) {
        contentHTML = '<div class="content-grid">';
        for (var i = 0; i < filtered.length; i++) {
          contentHTML += gridCardHTML(filtered[i], filtered[i].media_type);
        }
        contentHTML += '</div>';
      } else {
        contentHTML = '<div class="empty-state"><i class="fas fa-bookmark"></i><h3>Your watchlist is empty</h3><p>Start adding movies and shows to keep track of what you want to watch!</p><button class="btn-play" style="margin-top:16px" onclick="navigate(\'#/home\')"><i class="fas fa-search"></i> Browse</button></div>';
      }

      main.innerHTML =
        '<div class="watchlist-page page-enter">' +
          '<div class="page-header"><h1 class="page-title">My Watchlist</h1></div>' +
          '<div class="tabs-row">' +
            '<button class="tab-btn ' + (watchlistTab === 'all' ? 'active' : '') + '" onclick="watchlistTab=\'all\';renderWatchlist()">All</button>' +
            '<button class="tab-btn ' + (watchlistTab === 'movie' ? 'active' : '') + '" onclick="watchlistTab=\'movie\';renderWatchlist()">Movies</button>' +
            '<button class="tab-btn ' + (watchlistTab === 'tv' ? 'active' : '') + '" onclick="watchlistTab=\'tv\';renderWatchlist()">TV Shows</button>' +
          '</div>' +
          contentHTML +
        '</div>';
    }

    function renderHistory() {
      var main = document.getElementById('main-content');
      var clearBtn = state.history.length ? '<button style="color:var(--accent);font-size:0.85rem;font-weight:500" onclick="clearHistory()">Clear All</button>' : '';

      var listHTML = '';
      if (state.history.length) {
        for (var i = 0; i < state.history.length; i++) {
          var item = state.history[i];
          var date = new Date(item.watchedAt).toLocaleDateString();
          var epInfo = item.season ? ' &middot; S' + item.season + 'E' + item.episode : '';
          listHTML += '<div class="history-item" onclick="navigate(\'#/' + item.media_type + '/' + item.id + '\')">' +
            '<div class="history-thumb"><img src="' + imgUrl(item.poster_path, 'w154') + '" alt="" loading="lazy"></div>' +
            '<div class="history-info"><div class="history-title">' + item.title + '</div><div class="history-meta">' + date + epInfo + '</div></div>' +
            '<button class="history-delete" onclick="event.stopPropagation();removeHistoryItem(' + item.id + ')"><i class="fas fa-times"></i></button>' +
          '</div>';
        }
      } else {
        listHTML = '<div class="empty-state"><i class="fas fa-history"></i><h3>No watch history</h3><p>Items you watch will appear here</p><button class="btn-play" style="margin-top:16px" onclick="navigate(\'#/home\')"><i class="fas fa-search"></i> Browse</button></div>';
      }

      main.innerHTML =
        '<div class="history-page page-enter">' +
          '<div class="page-header"><h1 class="page-title">Watch History</h1>' + clearBtn + '</div>' +
          '<div>' + listHTML + '</div>' +
        '</div>';
    }

    function removeHistoryItem(id) {
      state.history = state.history.filter(function(i) { return i.id !== id; });
      storage.set('history', state.history);
      renderHistory();
    }

    function renderMyStuff() {
      var main = document.getElementById('main-content');
      main.innerHTML =
        '<div class="page-enter" style="padding-top:var(--header-height)">' +
          '<div class="page-header"><h1 class="page-title">My Stuff</h1></div>' +
          '<div style="padding:0 16px;display:flex;flex-direction:column;gap:12px">' +
            '<button class="settings-btn" onclick="navigate(\'#/watchlist\')" style="display:flex;align-items:center;gap:12px;text-align:left">' +
              '<i class="fas fa-bookmark" style="color:var(--accent);width:24px;text-align:center"></i><span>Watchlist</span>' +
              '<span style="margin-left:auto;color:var(--text-muted);font-size:0.8rem">' + state.watchlist.length + ' items</span>' +
            '</button>' +
            '<button class="settings-btn" onclick="navigate(\'#/history\')" style="display:flex;align-items:center;gap:12px;text-align:left">' +
              '<i class="fas fa-history" style="color:var(--accent);width:24px;text-align:center"></i><span>Watch History</span>' +
              '<span style="margin-left:auto;color:var(--text-muted);font-size:0.8rem">' + state.history.length + ' items</span>' +
            '</button>' +
            '<button class="settings-btn" onclick="navigate(\'#/settings\')" style="display:flex;align-items:center;gap:12px;text-align:left">' +
              '<i class="fas fa-cog" style="color:var(--accent);width:24px;text-align:center"></i><span>Settings</span>' +
            '</button>' +
          '</div>' +
        '</div>';
    }

    function renderSettings() {
      var main = document.getElementById('main-content');
      var themes = ['dark', 'amoled', 'light'];
      var accents = ['#e50914', '#2196f3', '#9c27b0', '#4caf50', '#f5c518'];

      var themeHTML = '';
      for (var i = 0; i < themes.length; i++) {
        var t = themes[i];
        var active = state.theme === t ? 'active' : '';
        themeHTML += '<button class="chip ' + active + '" onclick="setTheme(\'' + t + '\')" style="font-size:0.75rem;padding:6px 12px">' + t.charAt(0).toUpperCase() + t.slice(1) + '</button>';
      }

      var accentHTML = '';
      for (var j = 0; j < accents.length; j++) {
        var c = accents[j];
        var active = state.accent === c ? 'active' : '';
        accentHTML += '<div class="accent-dot ' + active + '" style="background:' + c + '" onclick="setAccent(\'' + c + '\')"></div>';
      }

      main.innerHTML =
        '<div class="settings-page page-enter">' +
          '<div class="page-header"><h1 class="page-title">Settings</h1></div>' +
          '<div class="settings-group">' +
            '<div class="settings-group-title">Appearance</div>' +
            '<div class="settings-item"><div class="settings-item-left"><i class="fas fa-palette"></i><span class="settings-item-label">Theme</span></div><div style="display:flex;gap:8px">' + themeHTML + '</div></div>' +
            '<div class="settings-item"><div class="settings-item-left"><i class="fas fa-circle"></i><span class="settings-item-label">Accent Color</span></div><div class="accent-colors">' + accentHTML + '</div></div>' +
          '</div>' +
          '<div class="settings-group">' +
            '<div class="settings-group-title">Data</div>' +
            '<button class="settings-btn danger" onclick="if(confirm(\'Clear watchlist?\')){state.watchlist=[];storage.set(\'watchlist\',[]);showToast(\'Watchlist cleared\',\'info\');renderSettings()}"><i class="fas fa-trash"></i> Clear Watchlist</button>' +
            '<button class="settings-btn danger" onclick="if(confirm(\'Clear history?\')){clearHistory()}"><i class="fas fa-trash"></i> Clear History</button>' +
            '<button class="settings-btn" onclick="exportData()"><i class="fas fa-download"></i> Export Data</button>' +
            '<button class="settings-btn" onclick="document.getElementById(\'import-file\').click()"><i class="fas fa-upload"></i> Import Data</button>' +
            '<input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">' +
          '</div>' +
          '<div class="settings-about">' +
            '<p><strong>StreamVault</strong> v1.0.0</p>' +
            '<p style="margin-top:8px">This product uses the TMDB API but is not endorsed or certified by TMDB.</p>' +
            '<p style="margin-top:8px">Video content is provided by external sources. StreamVault does not host any video content.</p>' +
          '</div>' +
        '</div>';
    }

    function setTheme(theme) {
      state.theme = theme;
      storage.set('theme', theme);
      applyTheme();
      renderSettings();
    }

    function setAccent(color) {
      state.accent = color;
      storage.set('accent', color);
      applyTheme();
      renderSettings();
    }

    function exportData() {
      var data = { watchlist: state.watchlist, history: state.history, recentSearches: state.recentSearches };
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'streamvault-data.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Data exported!', 'success');
    }

    function importData(event) {
      var file = event.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var data = JSON.parse(e.target.result);
          if (data.watchlist) { state.watchlist = data.watchlist; storage.set('watchlist', data.watchlist); }
          if (data.history) { state.history = data.history; storage.set('history', data.history); }
          if (data.recentSearches) { state.recentSearches = data.recentSearches; storage.set('recentSearches', data.recentSearches); }
          showToast('Data imported!', 'success');
          renderSettings();
        } catch(err) { showToast('Invalid file format', 'error'); }
      };
      reader.readAsText(file);
    }

    function init() {
      applyTheme();
      if (!window.location.hash) window.location.hash = '#/home';
      handleRoute();
    }

    init();
  </script>
</body>
</html>
