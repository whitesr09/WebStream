
<!DOCTYPE html>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/index.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0a0a0f; --bg-secondary: #12121a; --bg-card: #1a1a2e;
      --bg-glass: rgba(255,255,255,0.06); --bg-glass-strong: rgba(30,30,45,0.75);
      --accent: #e50914; --accent-hover: #ff1a25; --accent-gold: #f5c518;
      --text-primary: #ffffff; --text-secondary: #a0a0b0; --text-muted: #6b6b80;
      --gradient-hero: linear-gradient(to top, #0a0a0f 0%, transparent 60%);
      --gradient-card: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
      --border-subtle: rgba(255,255,255,0.08); --shadow-card: 0 8px 32px rgba(0,0,0,0.6);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
      --nav-height: 64px; --header-height: 56px;
      --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-top: env(safe-area-inset-top, 0px);
    }
    [data-theme="amoled"] { --bg-primary: #000000; --bg-secondary: #050505; --bg-card: #0d0d0d; --bg-glass: rgba(255,255,255,0.04); --bg-glass-strong: rgba(15,15,15,0.85); }
    [data-theme="light"] { --bg-primary: #f5f5f7; --bg-secondary: #ffffff; --bg-card: #ffffff; --bg-glass: rgba(0,0,0,0.04); --bg-glass-strong: rgba(255,255,255,0.85); --text-primary: #1a1a2e; --text-secondary: #555566; --text-muted: #888899; --border-subtle: rgba(0,0,0,0.08); --shadow-card: 0 8px 32px rgba(0,0,0,0.1); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    *::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
    html { font-size: 14px; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    @media (min-width: 768px) { html { font-size: 16px; } }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-primary); color: var(--text-primary); overflow-x: hidden; min-height: 100vh; min-height: 100dvh; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; padding-bottom: calc(var(--nav-height) + var(--safe-bottom)); }
    h1,h2,h3,h4,h5 { font-family: 'Poppins', sans-serif; font-weight: 700; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input,textarea,select { font-family: inherit; }
    #app { position: relative; min-height: 100vh; min-height: 100dvh; }

    .liquid-glass { background: var(--bg-glass-strong); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1); }
    [data-liquidglass="off"] .liquid-glass { background: var(--bg-card); backdrop-filter: none; -webkit-backdrop-filter: none; border: 1px solid var(--border-subtle); box-shadow: var(--shadow-card); }

    #top-header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: var(--header-height); padding: 0 16px; display: flex; align-items: center; justify-content: space-between; transition: background 0.3s; padding-top: var(--safe-top); }
    #top-header.scrolled { background: rgba(10,10,15,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-subtle); }
    .header-logo { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 1.4rem; color: var(--accent); letter-spacing: -0.5px; }
    .header-actions { display: flex; gap: 8px; }
    .header-actions button { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 1.1rem; }
    .header-actions button:hover { background: var(--bg-glass); }

    #bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; height: calc(var(--nav-height) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: rgba(10,10,15,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-around; transition: transform 0.3s; }
    #bottom-nav.hidden { transform: translateY(100%); }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 10px; min-width: 56px; position: relative; }
    .nav-item i { font-size: 1.15rem; color: var(--text-muted); }
    .nav-item span { font-size: 0.6rem; color: var(--text-muted); font-weight: 500; }
    .nav-item.active i, .nav-item.active span { color: var(--accent); }
    .nav-item.active::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 20px; height: 2px; background: var(--accent); border-radius: 2px; }

    #main-content { min-height: 100vh; min-height: 100dvh; }

    .hero { position: relative; width: 100%; height: 100svh; overflow: hidden; }
    @media (min-width: 768px) { .hero { height: 70vh; } }
    .hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s; }
    .hero-slide.active { opacity: 1; }
    .hero-slide img { width: 100%; height: 100%; object-fit: cover; animation: kenBurns 20s ease infinite alternate; }
    @keyframes kenBurns { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }
    .hero-overlay { position: absolute; inset: 0; background: var(--gradient-hero); }
    .hero-content { position: absolute; bottom: 80px; left: 16px; right: 16px; z-index: 2; }
    @media (min-width: 768px) { .hero-content { bottom: 60px; left: 40px; right: 40px; max-width: 600px; } }
    .hero-title { font-size: clamp(1.5rem, 5vw, 2.5rem); font-weight: 800; margin-bottom: 8px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); line-height: 1.1; }
    .hero-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
    .hero-rating { display: flex; align-items: center; gap: 4px; color: var(--accent-gold); font-weight: 600; font-size: 0.9rem; }
    .hero-meta span { color: var(--text-secondary); font-size: 0.85rem; }
    .hero-genres { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .hero-genre-tag { padding: 3px 10px; border-radius: 20px; background: var(--bg-glass); border: 1px solid var(--border-subtle); font-size: 0.7rem; color: var(--text-secondary); }
    .hero-overview { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .hero-buttons { display: flex; gap: 12px; }
    .btn-play { display: flex; align-items: center; gap: 8px; padding: 12px 24px; background: var(--accent); color: white; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.95rem; }
    .btn-play:hover { background: var(--accent-hover); }
    .btn-info { display: flex; align-items: center; gap: 8px; padding: 12px 20px; background: var(--bg-glass); backdrop-filter: blur(10px); border: 1px solid var(--border-subtle); color: white; border-radius: var(--radius-sm); font-weight: 500; font-size: 0.95rem; }
    .hero-dots { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 3; }
    .hero-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; }
    .hero-dot.active { background: var(--accent); width: 24px; border-radius: 4px; }

    .quick-chips { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scroll-snap-type: x mandatory; }
    .chip { flex-shrink: 0; padding: 8px 16px; border-radius: 20px; background: var(--bg-glass); border: 1px solid var(--border-subtle); font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); scroll-snap-align: start; white-space: nowrap; }
    .chip.active, .chip:hover { background: var(--accent); color: white; border-color: var(--accent); }

    .carousel-section { padding: 16px 0; }
    .carousel-header { display: flex; justify-content: space-between; align-items: center; padding: 0 16px; margin-bottom: 12px; }
    .carousel-title { font-size: 1.1rem; font-weight: 700; }
    .carousel-see-all { font-size: 0.8rem; color: var(--accent); font-weight: 500; }
    .carousel-track { display: flex; gap: 10px; padding: 0 16px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
    .carousel-card { flex-shrink: 0; width: 130px; scroll-snap-align: start; cursor: pointer; }
    @media (min-width: 480px) { .carousel-card { width: 150px; } }
    @media (min-width: 768px) { .carousel-card { width: 180px; } }
    @media (min-width: 1200px) { .carousel-card { width: 200px; } }
    .carousel-card:active { transform: scale(0.95); }
    .carousel-poster { position: relative; aspect-ratio: 2/3; border-radius: var(--radius-md); overflow: hidden; margin-bottom: 8px; }
    .carousel-poster img { width: 100%; height: 100%; object-fit: cover; }
    .carousel-poster-overlay { position: absolute; inset: 0; background: var(--gradient-card); opacity: 0; transition: opacity 0.3s; display: flex; align-items: center; justify-content: center; }
    .carousel-card:hover .carousel-poster-overlay { opacity: 1; }
    .carousel-poster-overlay i { font-size: 2rem; color: white; }
    .carousel-card-title { font-size: 0.8rem; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
    .carousel-card-rating { display: flex; align-items: center; gap: 4px; font-size: 0.75rem; color: var(--accent-gold); }
    .carousel-bookmark { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; z-index: 2; }
    .carousel-bookmark.saved { color: var(--accent); }

    .browse-header { position: sticky; top: var(--header-height); z-index: 50; background: rgba(10,10,15,0.9); backdrop-filter: blur(20px); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-subtle); }
    .browse-title { font-size: 1.2rem; font-weight: 700; }
    .browse-actions button { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-glass); display: flex; align-items: center; justify-content: center; }
    .content-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; }
    @media (min-width: 480px) { .content-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 768px) { .content-grid { grid-template-columns: repeat(5, 1fr); } }
    @media (min-width: 1200px) { .content-grid { grid-template-columns: repeat(6, 1fr); } }
    .grid-card { cursor: pointer; }
    .grid-card:active { transform: scale(0.95); }
    .grid-poster { position: relative; aspect-ratio: 2/3; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 6px; }
    .grid-poster img { width: 100%; height: 100%; object-fit: cover; }
    .grid-card-title { font-size: 0.75rem; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
    .grid-card-meta { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; }
    .grid-bookmark { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; font-size: 0.6rem; }
    .grid-bookmark.saved { color: var(--accent); }
    .adult-badge { position: absolute; top: 6px; left: 6px; padding: 2px 6px; background: #ff4444; color: white; border-radius: 4px; font-size: 0.6rem; font-weight: 700; z-index: 2; }
    .source-badge { position: absolute; bottom: 6px; left: 6px; padding: 2px 6px; background: var(--accent); color: white; border-radius: 4px; font-size: 0.55rem; font-weight: 600; z-index: 2; }

    .detail-page { padding-bottom: 40px; }
    .detail-backdrop { position: relative; width: 100%; height: 50vh; overflow: hidden; }
    @media (min-width: 768px) { .detail-backdrop { height: 60vh; } }
    .detail-backdrop img { width: 100%; height: 100%; object-fit: cover; }
    .detail-backdrop-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg-primary) 0%, transparent 50%, rgba(0,0,0,0.3) 100%); }
    .detail-backdrop-actions { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 5; padding-top: var(--safe-top); }
    .detail-back-btn, .detail-action-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
    .detail-right-actions { display: flex; gap: 8px; }
    .detail-body { position: relative; padding: 0 16px; margin-top: -80px; z-index: 3; }
    .detail-poster { width: 120px; aspect-ratio: 2/3; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); margin-bottom: 16px; border: 2px solid var(--border-subtle); }
    .detail-poster img { width: 100%; height: 100%; object-fit: cover; }
    .detail-title { font-size: clamp(1.3rem, 4vw, 2rem); font-weight: 800; margin-bottom: 4px; line-height: 1.2; }
    .detail-original-title { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
    .detail-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .detail-meta-item { display: flex; align-items: center; gap: 4px; font-size: 0.85rem; color: var(--text-secondary); }
    .detail-meta-item.rating { color: var(--accent-gold); font-weight: 600; }
    .detail-genres { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .detail-genre { padding: 4px 12px; border-radius: 20px; background: var(--bg-glass); border: 1px solid var(--border-subtle); font-size: 0.75rem; color: var(--text-secondary); }
    .detail-tagline { font-style: italic; color: var(--accent); font-size: 0.9rem; margin-bottom: 16px; }
    .detail-actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .detail-actions .btn-play { flex: 1; justify-content: center; min-width: 140px; }
    .detail-action-secondary { display: flex; align-items: center; gap: 6px; padding: 10px 16px; background: var(--bg-glass); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 500; }
    .detail-action-secondary.saved { color: var(--accent); border-color: var(--accent); }
    .detail-section { margin-bottom: 24px; }
    .detail-section-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
    .detail-overview { font-size: 0.9rem; line-height: 1.7; color: var(--text-secondary); }
    .detail-overview.expanded { -webkit-line-clamp: unset; }
    .detail-overview:not(.expanded) { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .read-more-btn { color: var(--accent); font-size: 0.85rem; font-weight: 500; margin-top: 4px; }
    .cast-carousel { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
    .cast-item { flex-shrink: 0; text-align: center; width: 70px; }
    .cast-photo { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; margin: 0 auto 6px; border: 2px solid var(--border-subtle); }
    .cast-photo img { width: 100%; height: 100%; object-fit: cover; }
    .cast-name { font-size: 0.7rem; font-weight: 500; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cast-character { font-size: 0.6rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

    .season-selector { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
    .season-tab { flex-shrink: 0; padding: 8px 16px; border-radius: var(--radius-sm); background: var(--bg-glass); border: 1px solid var(--border-subtle); font-size: 0.8rem; font-weight: 500; }
    .season-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
    .episode-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-subtle); cursor: pointer; }
    .episode-item:hover { background: var(--bg-glass); }
    .episode-thumb { flex-shrink: 0; width: 120px; aspect-ratio: 16/9; border-radius: var(--radius-sm); overflow: hidden; }
    .episode-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .episode-info { flex: 1; }
    .episode-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .episode-meta { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .episode-overview { font-size: 0.75rem; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* PLAYER - Fixed: Not fullscreen initially */
    .player-page { background: var(--bg-primary); min-height: 100vh; padding-bottom: 40px; }
    .player-video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; margin-bottom: 16px; }
    .player-video-container iframe { width: 100%; height: 100%; border: none; }
    .player-video-container.fullscreen { position: fixed; inset: 0; z-index: 300; aspect-ratio: unset; }
    .player-overlay { position: absolute; inset: 0; z-index: 10; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.8) 100%); opacity: 0; transition: opacity 0.3s; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
    .player-overlay.visible { opacity: 1; }
    .player-overlay > * { pointer-events: auto; }
    .player-top-bar { display: flex; align-items: center; padding: 16px; padding-top: calc(16px + var(--safe-top)); gap: 12px; }
    .player-back-btn { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .player-title-display { flex: 1; font-size: 0.9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .player-top-actions { display: flex; gap: 8px; }
    .player-top-actions button { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
    .player-center-controls { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 24px; }
    .player-ctrl-btn { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .player-ctrl-btn.main { width: 72px; height: 72px; font-size: 1.5rem; }
    .player-ctrl-btn:active { transform: scale(0.9); }
    .player-bottom-bar { padding: 16px; padding-bottom: calc(16px + var(--safe-bottom)); }
    .player-bottom-actions { display: flex; justify-content: space-around; align-items: center; }
    .player-bottom-actions button { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }

    .gesture-indicator { position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 60px; border-radius: 50%; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 20; }
    .gesture-indicator.visible { opacity: 1; }
    .gesture-indicator.left { left: 20px; }
    .gesture-indicator.right { right: 20px; }
    .gesture-indicator i { font-size: 1.2rem; margin-bottom: 4px; }
    .gesture-indicator span { font-size: 0.7rem; font-weight: 600; }

    .player-panel { position: absolute; bottom: 0; left: 0; right: 0; max-height: 70vh; overflow-y: auto; padding: 20px; padding-bottom: calc(20px + var(--safe-bottom)); transform: translateY(100%); transition: transform 0.3s ease; z-index: 25; background: var(--bg-secondary); border-radius: var(--radius-xl) var(--radius-xl) 0 0; }
    .player-panel.open { transform: translateY(0); }
    .player-panel-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; margin: 0 auto 16px; }
    .player-panel h3 { font-size: 1rem; margin-bottom: 12px; }
    .panel-option { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-glass); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); margin-bottom: 8px; cursor: pointer; }
    .panel-option:hover { background: rgba(255,255,255,0.1); }
    .panel-option.active { border-color: var(--accent); background: rgba(229,9,20,0.1); }
    .panel-option-icon { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-glass); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
    .panel-option-info { flex: 1; }

    async function api(endpoint, params) {
      params = params || {};
      var url = new URL(CONFIG.BASE + endpoint);
      var keys = Object.keys(params);
      for (var i = 0; i < keys.length; i++) { if (params[keys[i]] !== undefined && params[keys[i]] !== null) url.searchParams.set(keys[i], params[keys[i]]); }
      var cacheKey = url.toString();
      var cached = getCached(cacheKey);
      if (cached) return cached;
      for (var attempt = 0; attempt < 3; attempt++) {
        try {
          var res = await fetch(url.toString(), { headers: { 'Authorization': 'Bearer ' + getTmdbBearer(), 'Accept': 'application/json' } });
          if (res.status === 429) { await new Promise(function(r) { setTimeout(r, 1000 * (attempt + 1)); }); continue; }
          if (!res.ok) throw new Error('API ' + res.status);
          var data = await res.json();
          setCache(cacheKey, data);
          return data;
        } catch (e) { if (attempt === 2) return null; await new Promise(function(r) { setTimeout(r, 500 * (attempt + 1)); }); }
      }
      return null;
    }

    function handleRoute() {

        case 'anime': renderBrowse('anime'); break;
        case 'adult': renderAdult(); break;
        case 'search': renderSearch(); break;
        case 'movie': renderDetail('movie', route.id); break;
        case 'player': renderPlayer(route.id, route.extra, route.extra2, route.extra3); break;

        { title: '🏆 Top Rated Movies', endpoint: '/movie/top_rated', type: 'movie', filter: function(i) { return !i.adult; } },

      var titles = { movie: 'Movies', tv: 'TV Shows', anime: 'Anime' };

      await loadBrowsePage();
      var observer = new IntersectionObserver(function(entries) { if (entries[0].isIntersecting && !browseLoading && browsePage < browseTotalPages) loadBrowsePage(); }, { threshold: 0.1 });
      var loadMore = document.getElementById('load-more');
      if (loadMore) observer.observe(loadMore);
    }

    async function loadBrowsePage() {
      if (browseLoading) return;
      browseLoading = true;
      var endpoint, params = { page: browsePage, include_adult: state.showAdult };
      if (browseType === 'anime') { endpoint = '/discover/movie'; params.with_genres = '16'; params.with_keywords = '210024'; params.without_genres = '10749'; }
      else if (browseType === 'movie') endpoint = '/movie/popular';
      else endpoint = '/tv/popular';
      if (state.browseFilters.genre) { params.with_genres = state.browseFilters.genre; if (browseType === 'anime') endpoint = '/discover/movie'; else if (browseType === 'tv') endpoint = '/discover/tv'; else endpoint = '/discover/movie'; }
      if (state.browseFilters.sort) params.sort_by = state.browseFilters.sort;
      var data = await api(endpoint, params);
      browseLoading = false;
      if (!data || !data.results) return;
      browseTotalPages = data.total_pages || 1;
      var grid = document.getElementById('browse-grid');
      if (!grid) return;
      if (browsePage === 1) grid.innerHTML = '';
      var gridType = browseType === 'anime' ? 'movie' : browseType;
      for (var i = 0; i < data.results.length; i++) {
        if (!state.showAdult && data.results[i].adult) continue;
        grid.insertAdjacentHTML('beforeend', gridCardHTML(data.results[i], gridType));
      }

    async function addRepo() {
      var urlInput = document.getElementById('repo-url-input');
      var nameInput = document.getElementById('repo-name-input');
      if (!urlInput) return;
      var url = urlInput.value.trim();
      var name = nameInput ? nameInput.value.trim() : '';
      if (!url) { showToast('Please enter a URL', 'error'); return; }
      showToast('Fetching repository...', 'info');
      document.getElementById('modal-overlay').classList.remove('active');
      try {
        var rawUrl = url;
        if (url.includes('github.com') && !url.includes('raw.githubusercontent.com')) rawUrl = url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
        
        // FIXED: If URL ends with .json, fetch it directly
        var pluginsUrl = rawUrl;
        if (!rawUrl.endsWith('.json')) {
          pluginsUrl = rawUrl.replace(/\/$/, '') + '/plugins.json';
        }
        
        var plugins = [];
        var res = await fetch(pluginsUrl);
        if (res.ok) {
          var data = await res.json();
          // Handle different JSON formats
          if (Array.isArray(data)) plugins = data;
          else if (data.plugins && Array.isArray(data.plugins)) plugins = data.plugins;
          else if (data.sources && Array.isArray(data.sources)) plugins = data.sources;
          else if (data.extensions && Array.isArray(data.extensions)) plugins = data.extensions;
          else {
            // If it's a single plugin object
            plugins = [data];
          }
        }
        
        // Try other common filenames if no plugins found
        if (plugins.length === 0 && !rawUrl.endsWith('.json')) {
          var commonFiles = ['extensions.json', 'providers.json', 'sources.json', 'index.json', 'repo.json'];
          for (var cf = 0; cf < commonFiles.length; cf++) {
            var tryUrl = rawUrl.replace(/\/$/, '') + '/' + commonFiles[cf];
            try {
              var res2 = await fetch(tryUrl);
              if (res2.ok) {
                var data2 = await res2.json();
                if (Array.isArray(data2)) plugins = data2;
                else if (data2.plugins) plugins = data2.plugins;
                else if (data2.sources) plugins = data2.sources;
                else if (data2.extensions) plugins = data2.extensions;
                if (plugins.length > 0) break;
              }
            } catch(e) {}
          }
        }
        
        // If still no plugins, create a default
        if (plugins.length === 0) {
          plugins = [{ name: name || url.split('/').pop(), description: 'Plugin from ' + url, sources: [{ id: (name || url.split('/').pop()).toLowerCase().replace(/\s/g, ''), name: name || url.split('/').pop(), movieUrl: 'https://vidsrc.xyz/embed/movie/{id}', tvUrl: 'https://vidsrc.xyz/embed/tv/{id}/{season}/{episode}' }] }];
        }
        
        var processedPlugins = [];
        for (var i = 0; i < plugins.length; i++) {
          var p = plugins[i];
          processedPlugins.push({
            name: p.name || p.title || 'Plugin ' + (i+1),
            description: p.description || p.desc || '',
            url: url,
            version: p.version || '1.0',
            language: p.language || 'English',
            size: p.size || '10 kB',
            adult: p.adult || false,
            category: p.category || (p.type === 'tv' ? 'tv' : p.type === 'anime' ? 'anime' : 'movie'),
            icon: p.icon || (p.name ? p.name.charAt(0).toUpperCase() : 'P'),
            sources: p.sources || (p.movieUrl ? [{ id: p.id || p.name, name: p.name, movieUrl: p.movieUrl, tvUrl: p.tvUrl }] : []),
            installed: false
          });
        }
        
        var repo = { name: name || url.split('/').pop(), url: url, plugins: processedPlugins, addedAt: Date.now() };
        state.pluginRepos.push(repo);
        storage.set('pluginRepos', state.pluginRepos);
        showToast('Repository added! ' + processedPlugins.length + ' plugins found.', 'success');

    manifestLink.rel = 'manifest';
    manifestLink.href = manifestUrl;
    document.head.appendChild(manifestLink);

    function init() { applyTheme(); if (!window.location.hash) window.location.hash = '#/home'; handleRoute(); }
    init();
  </script>
</body>
</html>
